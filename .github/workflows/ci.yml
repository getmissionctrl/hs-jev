name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Build once — this compiles the library and both test suites and absorbs
      # the nix store realization + all build output.
      - name: Build
        run: nix develop .#dev --command cabal build all
      # Reuses the artifacts from the Build step, so this shows only test
      # results. The opt-in `live` suite self-skips when TYPESAFE_API_KEY is
      # unset, so CI needs no secret.
      - name: Run tests
        run: nix develop .#dev --command cabal test --test-show-details=direct
