name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Build
        run: nix develop .#dev --command cabal build all

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Compile first — this step absorbs the nix store realization and the
      # build output, so the run step below shows only test results.
      - name: Build tests
        run: nix develop .#dev --command cabal build all
      # Runs both suites. The opt-in `live` suite self-skips when
      # TYPESAFE_API_KEY is unset, so CI needs no secret.
      - name: Run tests
        run: nix develop .#dev --command cabal test --test-show-details=direct
